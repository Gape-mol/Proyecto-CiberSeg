version: "3.9"

# ============================================================
# Security Pipeline — Infraestructura completa
# ============================================================
# Servicios:
#   miner      → GitHub Miner (este módulo)
#   visualizer → viewer estático opcional
#
# Uso:
#   docker compose run --rm miner    # Ejecutar el miner una vez
#   docker compose up visualizer     # Levantar viewer estático

services:

  # ----------------------------------------------------------
  # GitHub Miner
  # ----------------------------------------------------------
  miner:
    build:
      context: .
      dockerfile: Dockerfile.miner
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_ORG: ${GITHUB_ORG}
      DB_PATH: /data/secpipeline.json
      CLONE_ROOT: /data/repos
      REPORTS_ROOT: /data/reports
      CLONE_WORKERS: ${CLONE_WORKERS:-5}
      REPO_VISIBILITY: ${REPO_VISIBILITY:-all}
      SKIP_ARCHIVED: ${SKIP_ARCHIVED:-false}
      CLONE_DEPTH: ${CLONE_DEPTH:-none}
      REPO_LIMIT: ${REPO_LIMIT:-50}
      REPO_RECENT_DAYS: ${REPO_RECENT_DAYS:-30}
      CODEQL_WORKERS: ${CODEQL_WORKERS:-1}
      RUN_CONTINUOUS: ${RUN_CONTINUOUS:-true}
      RUN_INTERVAL_SECONDS: ${RUN_INTERVAL_SECONDS:-3600}
    volumes:
      - repos_data:/data/repos
      - reports_data:/data/reports
      - dataset_data:/data
    restart: unless-stopped

  # ----------------------------------------------------------
  # Visualizer
  # ----------------------------------------------------------
  visualizer:
    image: python:3.12-slim
    working_dir: /app
    command: python -m http.server 4173
    volumes:
      - ./data-visualizer:/app:ro
      - dataset_data:/app/data:ro   # montado dentro de /app para que el HTTP server lo sirva
    ports:
      - "4173:4173"
    restart: unless-stopped

  # ----------------------------------------------------------
  # Jupyter Lab para los notebooks de análisis
  # ----------------------------------------------------------
  jupyter:
    image: python:3.12-slim
    working_dir: /workspace
    command: >
      bash -c "pip install --quiet jupyterlab pandas matplotlib seaborn &&
               pip install --quiet -r /workspace/analyzers/requirements.txt &&
               jupyter lab --ip=0.0.0.0 --no-browser --allow-root
               --port=8888 --notebook-dir=/workspace/analyzers
               --ServerApp.token='' --ServerApp.password=''"
    environment:
      DB_PATH: /data/secpipeline.json
    volumes:
      - ./analyzers:/workspace/analyzers
      - dataset_data:/data:ro
    ports:
      - "8888:8888"
    restart: unless-stopped

volumes:
  repos_data:
    driver: local
  reports_data:
    driver: local
  dataset_data:
    driver: local
